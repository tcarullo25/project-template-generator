# Local development stack. Values come from .env (copy it from .env.example).
#
#   docker compose up            start everything
#   docker compose up postgres   just the database, for running the apps natively
#   docker compose down -v       stop and delete the database volume

name: {{ProjectSlug}}

services:
  postgres:
    image: postgres:{{PostgresImageTag}}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-{{DatabaseName}}}
      POSTGRES_USER: ${POSTGRES_USER:-{{DatabaseUser}}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-{{PostgresPort}}}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-{{DatabaseUser}}} -d ${POSTGRES_DB:-{{DatabaseName}}}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: {{ApiHttpPort}}
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-{{DatabaseName}}};Username=${POSTGRES_USER:-{{DatabaseUser}}};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-{{WebDevPort}}}
    ports:
      - "${API_PORT:-{{ApiHttpPort}}}:{{ApiHttpPort}}"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # Empty base URL: the browser calls /api on the dev server, which proxies
      # to the api service (see vite.config.ts).
      VITE_API_BASE_URL: ""
      API_HOST: api
      API_PORT: {{ApiHttpPort}}
      WEB_PORT: {{WebDevPort}}
    ports:
      - "${WEB_PORT:-{{WebDevPort}}}:{{WebDevPort}}"
    volumes:
      # Mount sources for hot reload; keep the image's node_modules.
      - ./src/Frontend/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
