name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: dotnet build --configuration Release

      # Includes the opt-in smoke tests, which generate a project and then
      # build and test it with dotnet and npm.
      - run: dotnet test --configuration Release --no-build
        env:
          PTG_SMOKE_TESTS: "1"
